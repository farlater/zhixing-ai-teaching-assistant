name: Build student Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  student-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
      - name: Build installable demo APK
        run: gradle -p student-android :app:assembleDebug --stacktrace
      - name: Prepare artifact
        run: |
          mkdir -p release
          cp student-android/app/build/outputs/apk/debug/app-debug.apk "release/LiaokeZhixue-Student.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: zhixing-student-android-apk
          path: release/*.apk
          if-no-files-found: error
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.apk

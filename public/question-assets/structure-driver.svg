<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440">
  <rect width="900" height="440" rx="28" fill="#f3f7f5"/>
  <text x="42" y="53" fill="#173f3a" font-family="Microsoft YaHei, sans-serif" font-size="27" font-weight="700">同一双缸机构，不同原动件</text>
  <text x="42" y="89" fill="#688078" font-family="Microsoft YaHei, sans-serif" font-size="18">原动件改变后，杆组拆分路径也会改变</text>
  <line x1="450" y1="112" x2="450" y2="400" stroke="#d4ddd8" stroke-width="3" stroke-dasharray="9 10"/>
  <g transform="translate(30 105)">
    <text x="198" y="28" text-anchor="middle" fill="#a76f43" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="700">方案 A：构件 AB 为原动件</text>
    <g stroke="#285f56" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="70,235 122,151 228,104 286,198 356,126"/>
      <line x1="228" y1="104" x2="306" y2="67"/>
      <line x1="286" y1="198" x2="361" y2="242"/>
    </g>
    <g fill="#fff" stroke="#173f3a" stroke-width="5"><circle cx="70" cy="235" r="12"/><circle cx="122" cy="151" r="12"/><circle cx="228" cy="104" r="12"/><circle cx="306" cy="67" r="12"/><circle cx="286" cy="198" r="12"/><circle cx="356" cy="126" r="12"/><circle cx="361" cy="242" r="12"/></g>
    <path d="M79 230 H44 L69 258 Z" fill="#94a39d"/><line x1="45" y1="266" x2="96" y2="266" stroke="#94a39d" stroke-width="5"/>
    <path d="M91 143 Q105 112 134 126" fill="none" stroke="#d48752" stroke-width="5" marker-end="url(#orangeArrow)"/>
    <g font-family="Microsoft YaHei, sans-serif" font-size="18" fill="#173f3a" font-weight="700"><text x="50" y="220">A</text><text x="101" y="141">B</text><text x="211" y="91">C</text><text x="309" y="52">D</text><text x="269" y="188">E</text><text x="363" y="117">F</text><text x="366" y="267">G</text></g>
  </g>
  <g transform="translate(480 105)">
    <text x="198" y="28" text-anchor="middle" fill="#6a5b8b" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="700">方案 B：构件 EG 为原动件</text>
    <g stroke="#59736c" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="70,235 122,151 228,104 286,198 356,126"/>
      <line x1="228" y1="104" x2="306" y2="67"/>
      <line x1="286" y1="198" x2="361" y2="242" stroke="#6a5b8b" stroke-width="12"/>
    </g>
    <g fill="#fff" stroke="#173f3a" stroke-width="5"><circle cx="70" cy="235" r="12"/><circle cx="122" cy="151" r="12"/><circle cx="228" cy="104" r="12"/><circle cx="306" cy="67" r="12"/><circle cx="286" cy="198" r="12"/><circle cx="356" cy="126" r="12"/><circle cx="361" cy="242" r="12"/></g>
    <path d="M296 200 Q331 185 345 218" fill="none" stroke="#6a5b8b" stroke-width="5" marker-end="url(#purpleArrow)"/>
    <g font-family="Microsoft YaHei, sans-serif" font-size="18" fill="#173f3a" font-weight="700"><text x="50" y="220">A</text><text x="101" y="141">B</text><text x="211" y="91">C</text><text x="309" y="52">D</text><text x="269" y="188">E</text><text x="363" y="117">F</text><text x="366" y="267">G</text></g>
  </g>
  <defs>
    <marker id="orangeArrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#d48752"/></marker>
    <marker id="purpleArrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#6a5b8b"/></marker>
  </defs>
